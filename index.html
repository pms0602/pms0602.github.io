---
layout: default
title: Home
---

<section class="hero">
  <p>MY DEVELOPER JOURNAL</p>
  <h1>배우고, 만들고, 기록하다.</h1>
  <p>개발하면서 배운 지식과 경험을 기록하는 공간입니다.</p>
</section>

<section>
  <h2>Latest Posts</h2>

  {% for post in site.posts %}
    <article class="post-card">
      <p>{{ post.date | date: "%Y.%m.%d" }}</p>
      <h3>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h3>
      <p>{{ post.excerpt | strip_html | truncate: 120 }}</p>
    </article>
  {% else %}
    <p>아직 작성한 게시글이 없습니다.</p>
  {% endfor %}
</section>
