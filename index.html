<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background-size:cover;
    background-position:center;
    color:white;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.45);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:700px;
    text-align:center;
}

.hidden{
    display:none;
}

#clock{
    font-size:5rem;
    font-weight:bold;
}

#greeting{
    margin-top:15px;
    font-size:2rem;
}

#weather{
    margin-top:15px;
    font-size:1.1rem;
}

form{
    margin-top:20px;
}

input{
    padding:12px;
    border:none;
    border-radius:8px;
    width:250px;
}

button{
    padding:12px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#logout-btn{
    margin-top:15px;
    background:#e74c3c;
    color:white;
}

#todo-list{
    list-style:none;
    margin-top:20px;
}

#todo-list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
    padding:10px 15px;
    background:rgba(255,255,255,0.15);
    border-radius:10px;
}

.delete-btn{
    background:crimson;
    color:white;
}
</style>
</head>

<body>

<div class="overlay">
<div class="container">

<h1 id="clock">00:00:00</h1>

<form id="login-form">
    <input type="text" placeholder="이름 입력" required>
    <button type="submit">로그인</button>
</form>

<h2 id="greeting" class="hidden"></h2>

<button id="logout-btn" class="hidden">
    로그아웃
</button>

<div id="weather"></div>

<form id="todo-form" class="hidden">
    <input type="text" placeholder="할 일을 입력하세요" required>
    <button type="submit">추가</button>
</form>

<ul id="todo-list"></ul>

</div>
</div>

<script>

//배경

const backgrounds = [
"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600",
"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600",
"https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600",
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600",
"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600"
];

const randomBg =
backgrounds[Math.floor(Math.random()*backgrounds.length)];

document.body.style.backgroundImage =
`url(${randomBg})`;


//dom

const clock = document.getElementById("clock");

const loginForm = document.getElementById("login-form");
const loginInput = loginForm.querySelector("input");

const greeting = document.getElementById("greeting");

const logoutBtn = document.getElementById("logout-btn");

const todoForm = document.getElementById("todo-form");
const todoInput = todoForm.querySelector("input");

const todoList = document.getElementById("todo-list");

const weatherDiv = document.getElementById("weather");


//시계

function updateClock(){
    const now = new Date();

    const h =
    String(now.getHours()).padStart(2,"0");

    const m =
    String(now.getMinutes()).padStart(2,"0");

    const s =
    String(now.getSeconds()).padStart(2,"0");

    clock.innerText = `${h}:${m}:${s}`;
}

updateClock();
setInterval(updateClock,1000);


//로그인

const USERNAME_KEY = "username";

function paintGreeting(username){

    greeting.innerText =
    `안녕하세요 ${username}님 👋`;

    greeting.classList.remove("hidden");

    loginForm.classList.add("hidden");

    todoForm.classList.remove("hidden");

    logoutBtn.classList.remove("hidden");
}

function handleLogin(event){
    event.preventDefault();

    const username = loginInput.value;

    localStorage.setItem(
        USERNAME_KEY,
        username
    );

    paintGreeting(username);
}

loginForm.addEventListener(
    "submit",
    handleLogin
);

const savedUsername =
localStorage.getItem(USERNAME_KEY);

if(savedUsername){
    paintGreeting(savedUsername);
}

function logout(){

    localStorage.removeItem(USERNAME_KEY);

    location.reload();
}

logoutBtn.addEventListener(
    "click",
    logout
);


//투두

const TODOS_KEY = "todos";

let todos = [];

function saveTodos(){
    localStorage.setItem(
        TODOS_KEY,
        JSON.stringify(todos)
    );
}

function deleteTodo(event){

    const li =
    event.target.parentElement;

    todos = todos.filter(
        todo => todo.id !== Number(li.id)
    );

    saveTodos();

    li.remove();
}

function paintTodo(todoObj){

    const li =
    document.createElement("li");

    li.id = todoObj.id;

    const span =
    document.createElement("span");

    span.innerText = todoObj.text;

    const btn =
    document.createElement("button");

    btn.innerText = "삭제";

    btn.className = "delete-btn";

    btn.addEventListener(
        "click",
        deleteTodo
    );

    li.appendChild(span);
    li.appendChild(btn);

    todoList.appendChild(li);
}

function handleTodoSubmit(event){

    event.preventDefault();

    const newTodo =
    todoInput.value;

    todoInput.value = "";

    const todoObj = {
        text:newTodo,
        id:Date.now()
    };

    todos.push(todoObj);

    paintTodo(todoObj);

    saveTodos();
}

todoForm.addEventListener(
    "submit",
    handleTodoSubmit
);

const savedTodos =
localStorage.getItem(TODOS_KEY);

if(savedTodos){

    const parsedTodos =
    JSON.parse(savedTodos);

    todos = parsedTodos;

    parsedTodos.forEach(
        paintTodo
    );
}


//날씨

const API_KEY = "1ad681f81bcf60c5ced2dc24fa2fdf37";

function onGeoSuccess(position){

    const lat =
    position.coords.latitude;

    const lon =
    position.coords.longitude;

    const url =
`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`;

    fetch(url)
    .then(response => response.json())
    .then(data => {

        if(data.cod !== 200){
            weatherDiv.innerText =
            "날씨 정보를 불러올 수 없습니다.";
            return;
        }

        const city = data.name;

        const temp =
        Math.round(data.main.temp);

        const weather =
        data.weather[0].main;

        weatherDiv.innerText =
        `📍 ${city} | 🌡️ ${temp}°C | ☁️ ${weather}`;
    })
    .catch(() => {

        weatherDiv.innerText =
        "날씨 로딩 실패";
    });
}

function onGeoError(){

    weatherDiv.innerText =
    "위치 권한을 허용해주세요.";
}

navigator.geolocation.getCurrentPosition(
    onGeoSuccess,
    onGeoError
);

</script>

</body>
</html>
